<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="system-ui, sans-serif">
  <style>
    .bg    { fill:#1b1e24 }
    .panel { fill:#232830; stroke:#3a414d; stroke-width:1 }
    .field { fill:#1b1e24; stroke:#3a414d; stroke-width:1 }
    .chart { fill:#20242b; stroke:#3a414d; stroke-width:1; stroke-dasharray:4 4 }
    .t     { fill:#e6e9ee; font-size:13px }
    .tm    { fill:#9aa3b0; font-size:12px }
    .ts    { fill:#6f7784; font-size:11px }
    .th    { fill:#e6e9ee; font-size:15px; font-weight:600 }
    .acc   { fill:#b6e14f }
    .accT  { fill:#1b1e24; font-size:14px; font-weight:600 }
    .rule  { fill:#9aa3b0; font-size:11.5px; font-style:italic }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="620"/>

  <!-- chart area stays visible: the reason this is a panel and not a modal -->
  <rect class="chart" x="16" y="16" width="480" height="588" rx="4"/>
  <text class="tm" x="34" y="44">Chart bleibt sichtbar und bedienbar</text>
  <text class="ts" x="34" y="64">Rechtsklick auf die Preisskala → „Alarm hier“ (FEAT-0387)</text>
  <polyline points="40,300 90,260 140,290 190,220 240,250 290,180 340,210 390,150 440,175"
            fill="none" stroke="#4d5560" stroke-width="2"/>

  <!-- the panel -->
  <rect class="panel" x="512" y="16" width="372" height="588" rx="6"/>
  <text class="th" x="532" y="48">Super Alert</text>
  <text class="tm" x="846" y="48" text-anchor="end">✕</text>

  <!-- tab strip -->
  <text class="t"  x="532" y="82">Templates</text>
  <text class="tm" x="606" y="82">Combo</text>
  <text class="tm" x="658" y="82">Preis</text>
  <text class="tm" x="702" y="82">Indikatoren</text>
  <text class="tm" x="780" y="82">Kerzen</text>
  <text class="tm" x="832" y="82">…</text>
  <rect class="acc" x="532" y="90" width="60" height="2"/>
  <rect x="532" y="91" width="332" height="1" fill="#3a414d"/>

  <!-- header: symbol / price source / timeframe -->
  <rect class="field" x="532" y="106" width="102" height="30" rx="4"/>
  <text class="t" x="544" y="126">BTCUSDT ▾</text>
  <rect class="field" x="642" y="106" width="112" height="30" rx="4"/>
  <text class="t" x="654" y="126">Last Price ▾</text>
  <rect class="field" x="762" y="106" width="102" height="30" rx="4"/>
  <text class="t" x="774" y="126">4h ▾</text>

  <!-- conditions -->
  <rect class="field" x="532" y="152" width="332" height="40" rx="4"/>
  <text class="t"  x="548" y="177">⚡ MACD(12, 26, 9) Golden Cross</text>
  <text class="tm" x="846" y="177" text-anchor="end">🗑</text>

  <rect class="field" x="532" y="200" width="52" height="24" rx="12"/>
  <text class="t"  x="546" y="217">Und</text>
  <text class="tm" x="596" y="217">Oder</text>

  <rect class="field" x="532" y="232" width="332" height="40" rx="4"/>
  <text class="t"  x="548" y="257">⚡ RSI(14) unter 30</text>
  <text class="tm" x="846" y="257" text-anchor="end">🗑</text>

  <text class="acc" x="532" y="296" font-size="13">+ Bedingung hinzufügen (2/5)</text>
  <rect x="532" y="316" width="332" height="1" fill="#3a414d"/>

  <!-- footer: FEAT-0385 -->
  <text class="tm" x="532" y="344">Trigger-Methode</text>
  <text class="t"  x="864" y="344" text-anchor="end">In-App, Browser, Ton ▾</text>
  <text class="tm" x="532" y="374">Frequenz</text>
  <text class="t"  x="864" y="374" text-anchor="end">Einmal pro Kerzenschluss ▾</text>
  <text class="tm" x="532" y="404">Gültig bis</text>
  <text class="t"  x="864" y="404" text-anchor="end">2026-10-04 21:44 ▾</text>
  <text class="tm" x="532" y="434">Notiz</text>
  <text class="t"  x="864" y="434" text-anchor="end">Einstieg Swing-Long ▾</text>

  <!-- the part Bitunix does not have -->
  <rect x="532" y="454" width="332" height="1" fill="#3a414d"/>
  <text class="ts"   x="532" y="478">Diese Regel liest sich als:</text>
  <text class="rule" x="532" y="500">„Feuert einmal je 4h-Kerzenschluss, wenn</text>
  <text class="rule" x="532" y="518">MACD(12,26,9) golden crosst und RSI(14)</text>
  <text class="rule" x="532" y="536">unter 30 liegt.“</text>

  <rect class="acc" x="532" y="556" width="332" height="34" rx="17"/>
  <text class="accT" x="698" y="578" text-anchor="middle">Alarm erstellen</text>
</svg>
