[package]
name = "technicals-wasm"
version = "0.1.0"
authors = ["MYDCT"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.126"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }
serde-wasm-bindgen = "0.6.5"
rust_decimal = { version = "1.32", features = ["maths", "serde-with-str"] }
rust_decimal_macros = "1.32"

[dev-dependencies]
wasm-bindgen-test = "0.3.76"

[profile.release]
# Optimize for small code size; measured against opt-level = "z" when this
# profile was completed for BUG-0314 (see that item's PR for the numbers).
opt-level = "s"
# Fat LTO + single codegen unit: the crate is tiny and cold-start matters
# more than link time.
lto = true
codegen-units = 1
# Unwinding across the FFI boundary is undefined behaviour territory anyway;
# abort keeps landing-pad machinery out of the binary and makes every panic
# an immediate, visible trap instead of a silent cross-boundary unwind.
panic = "abort"
strip = true
