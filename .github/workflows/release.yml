name: Release

on:
  push:
    # main produces stable releases; develop produces `-beta.N` prereleases.
    # This mirrors the split already used by deploy.sh via .deploy.conf
    # (BRANCH_STABLE=main -> cachy.app, BRANCH_BETA=develop -> dev.cachy.app).
    branches: [main, develop]

# Prevent two releases from racing each other and producing duplicate tags.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    # Skip the release commit semantic-release pushes itself.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write # create tags, releases and the changelog commit
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release needs the full history and all tags to work out
          # which commits are new since the last release.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # Fold main back into develop right after a stable release. Without
      # this, develop's prerelease counter (1.0.0-beta.N) keeps counting up
      # from whatever it was when main last branched off, while main's
      # stable version jumps ahead independently (e.g. main at 1.1.0,
      # develop stuck offering 1.0.0-beta.15) — the two never realign on
      # their own. This mirrors the merge semantic-release already does
      # unattended (it commits and pushes its own release commit), so an
      # automatic push here is not a new trust boundary. If main and
      # develop have diverged in a way that actually conflicts, this step
      # fails loudly instead of pushing a broken merge — that case needs a
      # human, and CI turning red is the signal for it.
      - name: Back-merge main into develop
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin main develop
          git checkout -B develop origin/develop
          git merge origin/main --no-edit -m "chore(release): back-merge main into develop [skip ci]"
          git push origin develop
