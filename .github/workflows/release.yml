name: Release

on:
  push:
    # `main` produces stable releases, `develop` produces prereleases. Both are
    # pushed to directly by semantic-release, which is why `develop` carries
    # `enforce_admins: false` — see the branch comment in release.config.js.
    #
    # This mirrors the split already used by deploy.sh via .deploy.conf
    # (BRANCH_STABLE=main -> cachy.app, BRANCH_BETA=develop -> dev.cachy.app):
    # the branch that is built for dev.cachy.app is the branch that is
    # versioned, so the version string on that site is the one in the tree.
    branches: [main, develop]
  # Manual fallback to ship a release when automation was skipped (e.g. a merge
  # whose message quoted `[skip ci]` lines). Run it from the Actions tab on
  # `develop` or `main`; dispatching on any other branch fails on purpose,
  # in a step that names the reason.
  workflow_dispatch:

# Prevent two releases from racing each other and producing duplicate tags.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    # Skip the release commit semantic-release pushes itself. This matches the
    # commit title, not the whole message: a merge quoting beta
    # `chore(release): …` lines in its body once silently skipped a stable
    # release because of it.
    #
    # This guard is also what keeps the release loop closed. semantic-release
    # pushes its own `chore(release):` commit to the release branch, which
    # triggers this workflow again; that second run is skipped here.
    #
    # The commit carries no `[skip ci]` marker. GitHub reads that marker on the
    # pushed commit as "do not run CI", and a release commit is the one commit
    # where skipping the suite is least defensible — it is what dev.cachy.app
    # gets built from. The marker is not needed to break the loop; the title
    # check above already does that.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: write # create tags and the release commit
      issues: write # comment on released issues
      pull-requests: write # open the stable back-merge pull request
    steps:
      - uses: actions/checkout@v6
        with:
          # semantic-release needs the full history and all tags to work out
          # which commits are new since the last release.
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a dispatch on a branch that is not a release branch
        # Only reachable through workflow_dispatch. semantic-release would fail
        # on its own with a less specific message; this names the actual cause.
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" != "main" ] && [ "$REF_NAME" != "develop" ]; then
            echo "::error::Release runs on 'main' (stable) or 'develop' (prerelease). '$REF_NAME' is neither."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync moving deploy tags
        # deploy-build.yml force-recreates the rolling tags deploy-beta,
        # deploy-beta-previous and deploy-stable on every build. Those moving
        # tags make the plain `git fetch --tags` that semantic-release performs
        # fail with "would clobber existing tag". Force-fetch all tags to update
        # the local tags first so semantic-release's own fetch is a no-op.
        run: git fetch --tags --force

      # R1: semantic-release's push is hard-coded to `git push --tags`
      # (lib/git.js: `execa("git", ["push", "--tags", "--", repositoryUrl])`),
      # which offers no way to restrict it to the version tag. It therefore also
      # pushes the moving deploy tags, and rejects the run when they moved on
      # the remote in between — observed as
      # `! [rejected] deploy-beta-previous -> deploy-beta-previous (already
      # exists)`, which is what kept the first release on this branch failing.
        #
        # Deleting them locally removes them from that push. The remote copies
        # are untouched: `deploy-beta-previous` is the rollback artifact
        # deploy-build.yml recreates on every build, and nothing here writes to
        # the remote.
      - name: Drop moving deploy tags from the local repository
        run: |
          for tag in deploy-beta deploy-beta-previous deploy-stable; do
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              git tag -d "$tag"
              echo "Removed local $tag so the release push does not carry it."
            fi
          done
          echo "Local tags now: $(git tag --list 'v*' | wc -l) version tags."

      - name: Run semantic-release
        env:
          # RELEASE_TOKEN (when present) is the repo owner's fine-grained PAT.
          # It must be valid: a set-but-invalid value fails harder than an
          # absent one, because the `||` fallback never fires (BUG-0584).
          # Falls back to GITHUB_TOKEN so forks and local dry-runs keep
          # working without the secret.
          #
          # This push lands straight on the release branch. That requires
          # `develop` to carry `enforce_admins: false`; with it on, the push
          # authenticated and was refused with GH006 (BUG-0584), which is what
          # the `release/beta` detour existed to work around. See the branch
          # comment in release.config.js for what that setting now costs.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # Fold main back into develop right after a stable release. Without this,
      # develop's prerelease counter (1.0.0-beta.N) keeps counting up from
      # whatever it was when main last branched off, while main's stable version
      # jumps ahead independently (e.g. main at 1.1.0, develop stuck offering
      # 1.0.0-beta.15) — the two never realign on their own.
      #
      # A direct push would now be possible, since `develop` no longer
      # enforces on admins. This stays on a pull request deliberately: the
      # back-merge is the one release step that carries stable work into the
      # prerelease line, and running it through the ten required checks is
      # worth the click. The prerelease bump does not get that treatment —
      # it is mechanical, touches two files, and happens on every merge.
      #
      # If main and develop have diverged in a way that actually conflicts, the
      # merge step fails loudly instead of proposing a broken merge — that case
      # needs a human, and CI turning red is the signal for it.
      #
      # Same PAT, same reason as before: with the default GITHUB_TOKEN the pull
      # request is authored by github-actions[bot] and every workflow on it
      # waits for a human approval, so the back-merge would need a click after
      # each stable release.
      #
      # RELEASE_TOKEN is known to lack `pull-requests: write`, so this runs on
      # the automatic token and costs one human merge per stable release. This
      # path fires once per stable release rather than once per merge; fixing
      # the token scopes means the same GH_TOKEN split the prerelease step used
      # to carry, and doing that to a rarely-exercised path without being able
      # to test it is not worth the risk.
      - name: Propose the back-merge of main into develop
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="backmerge/main-into-develop"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch origin main develop
          git checkout -B "$branch" origin/develop
          git merge origin/main --no-edit -m "chore(release): back-merge main into develop"

          # Nothing to back-merge: main is already contained in develop.
          if git diff --quiet HEAD origin/develop; then
            echo "main is already merged into develop; no pull request needed."
            exit 0
          fi

          git push --force-with-lease origin "$branch"
          number=$(gh pr list --head "$branch" --base develop --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            # `gh pr create` prints the URL on stdout and has no `--json` flag,
            # unlike `gh pr list`. The number is the last path segment of the
            # URL it prints.
            url=$(gh pr create \
              --base develop \
              --head "$branch" \
              --title "chore(release): back-merge main into develop" \
              --body "[no issue]

          Automated back-merge of \`main\` into \`develop\` after a stable
          release.")
            number="${url##*/}"
            echo "Opened back-merge pull request #$number ($url)."
          else
            echo "Back-merge pull request #$number is already open."
          fi

          for attempt in 1 2 3 4 5; do
            if gh pr merge --auto --merge "$number" 2>/dev/null; then
              echo "Auto-merge armed on #$number (attempt $attempt)."
              exit 0
            fi
            echo "Auto-merge refused (attempt $attempt); updating the branch from develop."
            gh pr update-branch "$number" 2>/dev/null || true
          done
          echo "::error::Could not arm auto-merge on back-merge pull request #$number. It needs a human merge."
          exit 1