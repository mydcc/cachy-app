name: Release

# semantic-release on every push to develop (prerelease) or main (stable).
#
# It pushes its own `chore(release):` commit to the branch it just released —
# measured at ~38 s after the merge it belongs to. Under `strict=true` that put
# every other open pull request behind before its own checks could finish, so
# with two PRs in flight the second could never land without a manual rebase.
#
# The remedy for that is GitHub's native merge queue on `develop`, not a step in
# this workflow. A step calling `gh pr update-branch` was tried here and removed
# on 2026-10-11, for a reason that is worth keeping written down:
#
#   * With the automatic token it recreated the parked-run failure the deleted
#     stale-PR workflow had hit. Observed 2026-10-11: the release run updated PR
#     #4026, and the runs it triggered on the new head were created but held in
#     `action_required` instead of starting. The cause is this repo's Actions
#     `approval_policy: first_time_contributors` — `github-actions[bot]` is
#     caught by it. The same call from a human's `gh` login ran normally. So the
#     step rewrote every open PR's head and left its checks waiting for an
#     approval nobody knew to give: the block it was meant to remove.
#
#   * It also wrote a bot merge commit into every open branch, which that
#     branch's next rebase or force-push then has to reconcile. Rebase
#     automation that mutates other people's branches is itself a source of the
#     conflicts it claims to fix.
#
# Deliberately absent, with the reason:
#
#   * No conflict resolution. Conflicts in the generated backlog index
#     (`docs/backlog/INDEX.md` and its two companions) resolve by rebasing and
#     re-running `node scripts/backlog-index.mjs` — a human or agent step.
#
#   * No pull-request comments. The merge box already says the branch is out of
#     date; saying it again in 145 lines of shell per push was noise, and that
#     whole file is gone.

on:
  push:
    # `main` produces stable releases, `develop` prereleases. Both are pushed to
    # directly by semantic-release, which is why `develop` carries
    # `enforce_admins: false` (see the branch comment in release.config.js).
    #
    # This mirrors deploy.sh's split via .deploy.conf (BRANCH_STABLE=main ->
    # cachy.app, BRANCH_BETA=develop -> dev.cachy.app): the branch built for
    # dev.cachy.app is the branch that is versioned, so the version string on
    # that site is the one in the tree.
    branches: [main, develop]
  # Manual fallback to ship a release when automation was skipped (e.g. a merge
  # whose message quoted `[skip ci]` lines).
  workflow_dispatch:

# Prevent two releases from racing each other and producing duplicate tags.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    # Skip the release commit semantic-release pushes itself: that is what
    # closes the loop. Matched on the title only — a merge quoting beta
    # `chore(release):` lines in its body once silently skipped a stable release.
    #
    # No `[skip ci]` marker on that commit, deliberately: GitHub reads the
    # marker as "do not run CI", and a release commit is the one commit where
    # skipping the suite is least defensible — it is what dev.cachy.app is built
    # from.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: write # tag and push the release commit
      issues: write # comment on released issues
      pull-requests: write # open the back-merge PR, and update stale ones
    steps:
      - name: Refuse a manual run on a branch that is not a release branch
        # Only reachable through workflow_dispatch. semantic-release would fail
        # on its own with a less specific message; this names the cause.
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main' && github.ref_name != 'develop'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::Release runs on 'main' (stable) or 'develop' (prerelease). '$REF_NAME' is neither."
          exit 1

      - uses: actions/checkout@v6
        with:
          # semantic-release needs the full history and all tags to work out
          # which commits are new since the last release.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare the tags semantic-release will push
        # deploy-build.yml force-recreates the rolling tags deploy-beta,
        # deploy-beta-previous and deploy-stable on every build. semantic-release
        # pushes every tag it can see (`git push --tags`), and a moving tag it
        # does not know about rejects the entire push — the first release on this
        # branch failed with `! [rejected] deploy-beta-previous (already
        # exists)`. Fetch so the local copies are current, then drop them:
        # deleting them locally removes them from that push. The remote copies
        # are untouched — `deploy-beta-previous` is the rollback artifact
        # deploy-build.yml recreates on every build.
        run: |
          git fetch --tags --force
          for tag in deploy-beta deploy-beta-previous deploy-stable; do
            git tag -d "$tag" 2>/dev/null || true
          done

      - name: Run semantic-release
        env:
          # RELEASE_TOKEN (when present) is the repo owner's fine-grained PAT.
          # A set-but-invalid value fails harder than an absent one, because the
          # `||` fallback never fires (BUG-0584). Falls back to GITHUB_TOKEN so
          # forks and local dry-runs keep working without the secret.
          #
          # This push lands straight on the release branch, which requires
          # `develop` to carry `enforce_admins: false`; with it on, the push was
          # refused with GH006 (BUG-0584).
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Propose the back-merge of main into develop
        # Fold main back into develop after a stable release. Without this,
        # develop's prerelease counter (1.0.0-beta.N) keeps counting up from
        # whatever it was when main last branched off while main's stable version
        # jumps ahead independently — the two never realign on their own.
        #
        # A direct push would be possible now that develop no longer enforces on
        # admins. This stays a pull request deliberately: the back-merge is the
        # one release step that carries stable work into the prerelease line, and
        # running it through the required checks is worth the click.
        #
        # If main and develop have diverged in a way that actually conflicts, the
        # merge below fails loudly instead of proposing a broken merge.
        #
        # Auto-merge is armed once rather than retried: "Bring the open pull
        # requests back up to date" above already keeps this PR current after
        # every prerelease, which is what the retry loop used to work around.
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="backmerge/main-into-develop"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop
          git checkout -B "$branch" origin/develop
          git merge origin/main --no-edit -m "chore(release): back-merge main into develop"

          # Nothing to back-merge: main is already contained in develop.
          if git diff --quiet HEAD origin/develop; then
            echo "main is already merged into develop; no pull request needed."
            exit 0
          fi

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease origin "$branch"

          number=$(gh pr list --head "$branch" --base develop --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            # `gh pr create` prints the URL on stdout and has no `--json` flag,
            # unlike `gh pr list`. The number is its last path segment.
            url=$(gh pr create \
              --base develop \
              --head "$branch" \
              --title "chore(release): back-merge main into develop" \
              --body "[no issue]

          Automated back-merge of \`main\` into \`develop\` after a stable
          release.")
            number="${url##*/}"
            echo "Opened back-merge pull request #$number ($url)."
          else
            echo "Back-merge pull request #$number is already open."
          fi

          # Arming is idempotent and needs no passing checks, so a failure here
          # is not "the checks have not reported yet" — it is a real permission
          # or API problem, and the message says which token this step actually
          # uses. It stays a warning rather than an error on purpose: the
          # release has already shipped by this point, and a red run would make
          # `release-failure-alert.yml` announce a failed release that did not
          # fail. The PR is bot-authored, so `audit.yml` skips it and it always
          # needs a human to merge anyway.
          gh pr merge --auto --merge "$number" \
            || echo "::warning::#${number} could not be armed for auto-merge — merge it by hand. Note: this step uses GITHUB_TOKEN, and the pull request is bot-authored, so audit.yml skips its checks."
