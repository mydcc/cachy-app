# Deploy Staging via xyOps: läuft NACH dem bestehenden "Deploy Build"-
# Workflow, wenn er erfolgreich war und der Push nach develop ging.
# So ist das CI-Artifact garantiert frisch, wenn deploy.sh --ci es lädt.
# Guard: Endet "Deploy Build" per [skip ci] als (leerer) Erfolg, hat das
# deploy-beta-Release noch den alten Commit als target_commitish - dann
# wird der Staging-Deploy ausgelassen, statt ein veraltetes Artifact
# neu auszurollen.
# Benötigt Repo-Secret: XYOPS_API_KEY (xyOps Key nur mit "Run Jobs").

name: Deploy Staging (dev.cachy.app)

on:
  workflow_run:
    workflows: ["Deploy Build"]
    types: [completed]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read # deploy-beta-Release auf Artifact-Frische prüfen
    steps:
      - name: Check CI artifact matches triggering commit
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAG_SHA=$(gh api "repos/${{ github.repository }}/releases/tags/deploy-beta" \
            --jq '.target_commitish')
          echo "deploy-beta target_commitish=$TAG_SHA"
          # Pin the asset itself, not the moving tag: a newer build may publish
          # while this deploy runs, and the final check must compare against the
          # artifact this run actually deployed.
          ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/tags/deploy-beta" \
            --jq '.assets[] | select(.name == "cachy-build.tar.gz") | .id')
          echo "asset_id=$ASSET_ID" >> "$GITHUB_OUTPUT"
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::notice::Artifact ($TAG_SHA) != Trigger-Commit ($HEAD_SHA) - Deploy Build wurde uebersprungen ([skip ci]). Staging-Deploy ausgelassen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger xyOps deploy job
        id: trigger
        if: steps.artifact.outputs.skip != 'true'
        env:
          XYOPS_KEY: ${{ secrets.XYOPS_API_KEY }}
        run: |
          RESP=$(curl -sf -X POST \
            -H "X-API-Key: $XYOPS_KEY" \
            -H 'Content-Type: application/json' \
            https://xyops.heinze-media.com/api/app/run_event/v1 \
            -d '{"id":"emt8vskf33hnc6pa"}')
          echo "$RESP"
          JOB_ID=$(echo "$RESP" | jq -r '.id // empty')
          [ -n "$JOB_ID" ] || { echo "::error::xyOps trigger failed"; exit 1; }
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for xyOps job to finish
        if: steps.artifact.outputs.skip != 'true'
        env:
          XYOPS_KEY: ${{ secrets.XYOPS_API_KEY }}
          JOB_ID: ${{ steps.trigger.outputs.job_id }}
        run: |
          for i in $(seq 1 90); do
            sleep 10
            STATUS=$(curl -sf -H "X-API-Key: $XYOPS_KEY" \
              "https://xyops.heinze-media.com/api/app/get_job/v1?id=$JOB_ID")
            COMPLETE=$(echo "$STATUS" | jq -r '.job.complete // false')
            if [ "$COMPLETE" != "false" ]; then
              echo "$STATUS" | jq '{code: .job.code, description: .job.description}'
              [ "$(echo "$STATUS" | jq -r '.job.code')" = "0" ] || {
                echo "::error::Deploy fehlgeschlagen - Logs in xyOps Job $JOB_ID"
                exit 1
              }
              echo "Staging-Deploy erfolgreich (Job $JOB_ID)"
              exit 0
            fi
          done
          echo "::error::Timeout beim Warten auf xyOps Job $JOB_ID"
          exit 1

      - name: Verify the served build matches the artifact
        if: steps.artifact.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ steps.artifact.outputs.asset_id }}
          STAGING_URL: ${{ vars.STAGING_URL || 'https://dev.cachy.app' }}
        run: |
          # The xyOps job can report code 0 before the host has finished the
          # swap: on 2026-10-28 a run reported success at 19:43 while the host
          # still served beta.466 and only switched to beta.467 at ~19:49. A
          # single status check is therefore not proof; wait for the build id
          # published by the artifact to be the one the host serves.
          gh api "repos/${{ github.repository }}/releases/assets/$ASSET_ID" \
            -H "Accept: application/octet-stream" > /tmp/cachy-build.tar.gz
          EXPECTED=$(tar -xzOf /tmp/cachy-build.tar.gz build/client/_app/version.json | jq -r .version)
          echo "artifact build: $EXPECTED"
          SERVED=""
          for i in $(seq 1 60); do
            SERVED=$(curl -fsS "$STAGING_URL/_app/version.json" 2>/dev/null | jq -r '.version // empty' || true)
            if [ "$SERVED" = "$EXPECTED" ]; then
              echo "Staging serves the artifact build ($EXPECTED)."
              exit 0
            fi
            echo "[$i] served build: ${SERVED:-none} (expected $EXPECTED)"
            sleep 10
          done
          echo "::error::Staging still serves ${SERVED:-no build}, expected $EXPECTED"
          exit 1
