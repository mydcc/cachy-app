name: Weekly Dependency Updates

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Update minor and patch dependencies
        id: update
        run: |
          npm update --save

          if git diff --quiet package.json package-lock.json; then
            echo "No updates available."
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Run audit and fix
        if: steps.update.outputs.has_updates == 'true'
        run: npm audit fix || true

      - name: Run build/check/test
        if: steps.update.outputs.has_updates == 'true'
        run: |
          npm ci
          npm run check
          npm test

      - name: List major updates
        if: steps.update.outputs.has_updates == 'true'
        id: major_updates
        run: |
          OUTDATED=$(npm outdated --json || true)
          MAJOR_UPDATES=""

          # Parse the JSON output and find packages where Wanted version's major is less than Latest version's major
          if [ -n "$OUTDATED" ] && [ "$OUTDATED" != "{}" ]; then
            MAJOR_UPDATES=$(node -e "
              const outdated = JSON.parse(process.argv[1]);
              const majors = [];
              for (const pkg in outdated) {
                const wanted = outdated[pkg].wanted;
                const latest = outdated[pkg].latest;
                if (!wanted || !latest) continue;

                const wantedMajor = parseInt(wanted.split('.')[0]);
                const latestMajor = parseInt(latest.split('.')[0]);

                if (latestMajor > wantedMajor) {
                  majors.push('- \`' + pkg + '\`: ' + wanted + ' -> ' + latest);
                }
              }
              if (majors.length > 0) {
                console.log('### Available Major Updates (Not Applied)\n');
                console.log('The following packages have major version updates available but were not applied to avoid breaking changes:\n');
                console.log(majors.join('\n'));
              }
            " "$OUTDATED")
          fi

          if [ -n "$MAJOR_UPDATES" ]; then
            echo "major_updates<<EOF_MAJOR" >> $GITHUB_OUTPUT
            echo "$MAJOR_UPDATES" >> $GITHUB_OUTPUT
            echo "EOF_MAJOR" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.update.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): weekly dependency updates"
          title: "chore(deps): weekly dependency updates"
          branch: "chore/weekly-updates"
          delete-branch: true
          body: |
            Automated weekly dependency updates for minor and patch versions.

            This PR includes changes generated by running `npm update --save` and `npm audit fix`.
            Tests (`npm run check` and `npm test`) have passed.

            ${{ steps.major_updates.outputs.major_updates }}
