name: Release Failure Alert

# AC3 of BUG-0584: a dead release pipeline went unnoticed for eight days
# because nothing watches the Release workflow. This workflow watches it:
# every completed Release run on develop/main either opens (or bumps) a
# tracking issue on failure, or closes it on recovery.
#
# Least-privilege: no checkout, no code — it only reads the triggering run
# and writes issues. It never touches the repo or the release itself.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    # R4: the prerelease runs on release/beta, not on develop — watching only
    # the first two meant a failing prerelease produced no comment at all,
    # which is the same silence BUG-0584 was filed about.
    branches: [develop, main, release/beta]

jobs:
  alert:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const TITLE = "[release-alert] Release pipeline failing";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const open = issues.find((i) => i.title === TITLE);
            const link = `Failed run: ${run.html_url} (${run.head_branch} @ ${run.head_sha.slice(0, 8)}, conclusion: ${run.conclusion}).`;
            if (run.conclusion === "failure") {
              if (open) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: open.number,
                  body: `Still failing.\n\n${link}`,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: TITLE,
                  labels: ["bug", "ci"],
                  body: [
                    "The Release workflow failed. No release ships while this is red —",
                    "see BUG-0584 for the diagnosis history.",
                    "",
                    link,
                  ].join("\n"),
                });
              }
            } else if (run.conclusion === "success" && open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `Recovered.\n\n${link}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                state: "closed",
              });
            }
