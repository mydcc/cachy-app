name: OpenWiki Update

on:
  schedule:
    # every hour
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    env:
      OPENWIKI_PROVIDER: openai-compatible
      OPENAI_COMPATIBLE_BASE_URL: https://opencode.ai/zen/v1
      OPENWIKI_MODEL_ID: opencode-zen/big-pickle
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenWiki
        run: |
          npm install -g openwiki

      - name: Initialize OpenWiki (once)
        run: |
          openwiki --init

      - name: Update Wiki
        run: |
          openwiki --update
