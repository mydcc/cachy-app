name: Sync Release Branch

on:
  push:
    # A change on develop has to reach the branch semantic-release actually
    # pushes to, or it never sees the commits it is meant to version.
    branches: [develop]
    # No `paths-ignore` here, deliberately. The Release workflow uses one to skip
    # docs-only pushes, and copying it here meant a pull request whose only code
    # was under `.github/workflows/` never reached release/beta — so every fix to
    # the release pipeline sat on develop and the next release versioned the old
    # configuration. That is how a channel fix merged to develop still computed
    # 1.6.0-beta.1. The docs-only case is cheap to skip in the job instead, and
    # it can be skipped correctly: see "Skip a docs-only push" below.
  # Manual: the release reads its configuration from release/beta, not from
  # develop, so a fix merged into develop only takes effect once this branch
  # carries it. A release run against a stale branch silently versions the old
  # configuration — that is how a channel fix merged to develop kept computing
  # 1.6.0-beta.1. Run this by hand after merging a release fix.
  workflow_dispatch:

# R2: without this, two syncs racing on the same ref make the second
# --force-with-lease fail and the release then runs against a half-moved
# branch. Same shape as deploy-build.yml's group.
concurrency:
  group: sync-release-branch
  cancel-in-progress: false

jobs:
  sync:
    name: mirror develop onto release/beta
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # The docs-only case that `paths-ignore` used to handle, done where it can
      # be done correctly. A push that touches nothing but docs and markdown
      # cannot produce a release, so it must not move release/beta — but a push
      # that touches release.yml is code, and skipping it is what broke the
      # pipeline twice. `git diff` over the pushed commit's first parent is the
      # same question the trigger filter used to answer, and the answer is kept.
      - name: Skip a docs-only push
        id: docs-only
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "HEAD^" HEAD)
          if [ -z "$changed" ]; then
            echo "no parent to compare against; syncing"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          non_docs=$(printf '%s\n' "$changed" | grep -vE '^(docs/.*|\.github/.*\.md|.*\.md)$' || true)
          if [ -z "$non_docs" ]; then
            echo "Docs-only push ($(printf '%s\n' "$changed" | wc -l) files); leaving release/beta alone."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Code present:"
            printf '%s\n' "$non_docs" | head -10 | sed 's/^/    /'
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Point release/beta at develop
        if: steps.docs-only.outputs.skip != 'true'
        env:
          # The name matters. `gh` authenticates from GH_TOKEN or GITHUB_TOKEN
          # and from nothing else — a step that exports the secret under its own
          # name has no working `gh`, and the run dies at the first `gh` call
          # with "To use GitHub CLI in a GitHub Actions workflow, set the
          # GH_TOKEN environment variable". This step called `gh pr list` under
          # SYNC_TOKEN, so it failed on every push, including the ones that
          # carried the release-pipeline fixes.
          #
          # The PAT rather than the automatic token, because a push made with
          # GITHUB_TOKEN does not trigger other workflows: the Release run this
          # push exists to cause would never start.
          #
          # It must be valid — a set-but-invalid secret fails harder than an
          # absent one (BUG-0584).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch origin develop
          if ! git rev-parse --verify --quiet origin/release/beta; then
            echo "release/beta does not exist yet; creating it at develop."
            git push origin origin/develop:refs/heads/release/beta
            exit 0
          fi

          # A release commit is waiting on develop. Moving the branch now would
          # discard it and lose the version bump, so leave it alone: the Release
          # workflow owns the branch until its pull request lands.
          open=$(gh pr list --head release/beta --base develop --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "Release pull request #$open is still open; leaving release/beta untouched."
            exit 0
          fi

          if git diff --quiet origin/release/beta origin/develop; then
            echo "release/beta is already at develop."
            exit 0
          fi

          echo "Moving release/beta to develop (force-with-lease, so a concurrent release push wins over this one)."
          git push --force-with-lease origin origin/develop:refs/heads/release/beta