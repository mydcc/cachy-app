name: Sync Backlog to GitHub Issues

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'docs/backlog/**/*.md'
  workflow_dispatch: # Allow manual trigger

# Prevent two sync jobs from racing each other and producing duplicate issues.
concurrency:
  group: sync-backlog
  cancel-in-progress: false

jobs:
  sync-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      # Read-only checkout: this job only calls the GitHub API (issue mirror,
      # Kanban board, PR-body auto-linker). It opens no PRs and pushes no
      # branches — the index-PR step is gone, the flip lives in the fix PR.
      contents: read
      repository-projects: write
      # The sync's auto-linker (ensurePRsAreLinked) PATCHes open PR bodies to
      # prepend `Fixes #N`. Without this scope that PATCH is rejected and the
      # PR merges with no closing reference — closing nothing (BUG-0307).
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        # Only `tsx` is needed to run the sync script; skip devDependencies
        # (playwright, puppeteer, eslint, vitest, ...) to keep this fast.
        run: npm ci --omit=dev

      - name: Run Sync Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx scripts/sync-github-issues.ts
