name: Sync Backlog to GitHub Issues

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'docs/backlog/**/*.md'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      projects: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        # Only `tsx` is needed to run the sync script; skip devDependencies
        # (playwright, puppeteer, eslint, vitest, ...) to keep this fast.
        run: npm ci --omit=dev

      - name: Run Sync Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx scripts/sync-github-issues.ts
