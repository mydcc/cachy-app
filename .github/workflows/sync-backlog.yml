name: Sync Backlog to GitHub Issues

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'docs/backlog/**/*.md'
  workflow_dispatch: # Allow manual trigger

# Prevent two sync jobs from racing each other and producing duplicate issues.
concurrency:
  group: sync-backlog
  cancel-in-progress: false

jobs:
  sync-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      repository-projects: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        # Only `tsx` is needed to run the sync script; skip devDependencies
        # (playwright, puppeteer, eslint, vitest, ...) to keep this fast.
        run: npm ci --omit=dev

      - name: Run Sync Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx scripts/sync-github-issues.ts

      # Regenerate the index and publish it directly to this branch — never as
      # part of a feature PR. INDEX.md has two summary lines (item counts,
      # next free number) that change on every single regeneration regardless
      # of which item changed, so requiring every backlog PR to carry its own
      # fresh copy was a guaranteed merge-conflict source once more than one
      # such PR was in flight (see BUG-0225). This is the only place INDEX.md
      # is ever committed.
      #
      # Retries on a rejected push: other automation (semantic-release's
      # release commits, another sync run) also pushes straight to this
      # branch, so `origin/<branch>` can move between checkout and push.
      # INDEX.md is fully regenerable from the current tree and nothing else
      # in this job's working copy is precious, so on rejection it's safe to
      # just re-sync to the new tip and regenerate again rather than trying
      # to merge/rebase a generated file.
      - name: Regenerate and commit index (retries on a moved base)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            node scripts/backlog-index.mjs
            if git diff --quiet -- docs/backlog/INDEX.md docs/backlog/backlog.generated.ts docs/backlog/backlog.generated.json; then
              echo "Backlog generated artifacts unchanged, nothing to commit."
              exit 0
            fi
            git add docs/backlog/INDEX.md docs/backlog/backlog.generated.ts docs/backlog/backlog.generated.json
            git commit -m "chore(backlog): regenerate INDEX.md and backlog artifacts [skip ci]"
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Pushed successfully on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — ${{ github.ref_name }} moved. Re-syncing and retrying..."
            git reset --hard HEAD~1
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            sleep $((attempt * 3))
          done
          echo "Failed to push docs/backlog/INDEX.md after 5 attempts."
          exit 1
