name: Sync Backlog to GitHub Issues

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'docs/backlog/**/*.md'
  workflow_dispatch: # Allow manual trigger

# Prevent two sync jobs from racing each other and producing duplicate issues.
concurrency:
  group: sync-backlog
  cancel-in-progress: false

jobs:
  sync-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      repository-projects: write
      # The sync's auto-linker (ensurePRsAreLinked) PATCHes open PR bodies to
      # prepend `Fixes #N`. Without this scope that PATCH is rejected and the
      # PR merges with no closing reference — closing nothing (BUG-0307).
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        # Only `tsx` is needed to run the sync script; skip devDependencies
        # (playwright, puppeteer, eslint, vitest, ...) to keep this fast.
        run: npm ci --omit=dev

      - name: Run Sync Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx scripts/sync-github-issues.ts

      # INDEX.md and the generated artifacts are pushed to a short-lived branch
      # and merged via PR so the branch protection checks run normally.
      # Force-pushing to the same branch name updates any already-open PR in
      # place — at most one backlog-index PR is open per target branch at a time.
      - name: Regenerate and commit index via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          node scripts/backlog-index.mjs

          if git diff --quiet -- docs/backlog/INDEX.md docs/backlog/backlog.generated.ts docs/backlog/backlog.generated.json; then
            echo "Backlog generated artifacts unchanged, nothing to commit."
            exit 0
          fi

          TARGET="${{ github.ref_name }}"
          BRANCH="chore/backlog-index-${TARGET}"

          git checkout -b "$BRANCH"
          git add docs/backlog/INDEX.md docs/backlog/backlog.generated.ts docs/backlog/backlog.generated.json
          git commit -m "chore(backlog): regenerate INDEX.md and backlog artifacts"
          git push origin "$BRANCH" --force

          # Open a PR only if none exists yet — force-push keeps existing PRs up to date.
          if ! gh pr view "$BRANCH" --json number -q .number 2>/dev/null; then
            gh pr create \
              --title "chore(backlog): regenerate INDEX.md" \
              --body "Auto-generated by the backlog sync workflow. Updates \`INDEX.md\` and generated artifacts on \`${TARGET}\`." \
              --base "$TARGET" \
              --head "$BRANCH"
          fi

          # Enable auto-merge so the PR closes itself once all checks pass.
          gh pr merge "$BRANCH" --auto --squash 2>/dev/null || \
            echo "Note: auto-merge unavailable — please merge the PR manually."
