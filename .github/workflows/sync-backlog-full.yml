name: Sync Backlog to GitHub Issues (full resync)

# sync-backlog.yml skips a backlog item entirely once it's closed and
# already matches what GitHub has (see FORCE_FULL_SYNC in
# scripts/sync-github-issues.ts, BUG-0226) — that's what keeps push-triggered
# runs fast as the backlog grows. This is the safety net for what that skip
# can't see: drift that happens without a matching backlog-file change, e.g.
# a Kanban card moved by hand, or a label edited directly on the issue.
# Runs weekly and forces every item through in full, no skip.

on:
  schedule:
    - cron: '0 5 * * 1' # Monday 05:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-backlog
  cancel-in-progress: false

jobs:
  full-resync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      repository-projects: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Run Sync Script (full resync)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_FULL_SYNC: 'true'
        run: npx tsx scripts/sync-github-issues.ts

      - name: Regenerate backlog index
        run: node scripts/backlog-index.mjs

      - name: Commit index if changed
        run: |
          if git diff --quiet -- docs/backlog/INDEX.md; then
            echo "INDEX.md unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/backlog/INDEX.md
          git commit -m "chore(backlog): regenerate INDEX.md [skip ci]"
          git push origin HEAD:develop
