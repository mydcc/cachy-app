name: Sync Backlog to GitHub Issues (full resync)

# sync-backlog.yml skips a backlog item entirely once it's closed and
# already matches what GitHub has (see FORCE_FULL_SYNC in
# scripts/sync-github-issues.ts, BUG-0226) — that's what keeps push-triggered
# runs fast as the backlog grows. This is the safety net for what that skip
# can't see: drift that happens without a matching backlog-file change, e.g.
# a Kanban card moved by hand, or a label edited directly on the issue.
# Runs weekly and forces every item through in full, no skip.

on:
  schedule:
    - cron: '0 5 * * 1' # Monday 05:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-backlog
  cancel-in-progress: false

jobs:
  full-resync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      repository-projects: write
      # See sync-backlog.yml for why: the auto-linker PATCHes PR bodies.
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Run Sync Script (full resync)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_FULL_SYNC: 'true'
        run: npx tsx scripts/sync-github-issues.ts

      # INDEX.md is pushed to a short-lived branch and merged via PR so the
      # branch protection checks run normally. Force-pushing to the same branch
      # name updates any already-open PR in place.
      #
      # Single-bot-PR: if a `bot/backlog-auto-done` PR is open, fold the fresh
      # index into its branch instead of opening a second PR (routing via
      # `scripts/lib/bot-pr-fold.ts`). Same pattern as `sync-backlog.yml`.
      - name: Regenerate and commit index via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET="develop"
          INDEX_BRANCH="chore/backlog-index-develop"
          AUTO_DONE_BRANCH="bot/backlog-auto-done"
          ARTIFACTS="docs/backlog/INDEX.md docs/backlog/backlog.generated.ts docs/backlog/backlog.generated.json"

          node scripts/backlog-index.mjs

          # shellcheck disable=SC2086
          if git diff --quiet -- $ARTIFACTS; then
            echo "Backlog generated artifacts unchanged, nothing to commit."
            exit 0
          fi

          DECISION="create-index-pr"
          for wait in 0 20 20; do
            sleep "$wait"
            AUTO_DONE_OPEN="$(gh pr list --head "$AUTO_DONE_BRANCH" --base "$TARGET" --state open --json number --jq 'length' 2>/dev/null || echo 0)"
            INDEX_OPEN="$(gh pr list --head "$INDEX_BRANCH" --base "$TARGET" --state open --json number --jq 'length' 2>/dev/null || echo 0)"
            DECISION="$(npx tsx scripts/lib/bot-pr-fold.ts "$AUTO_DONE_OPEN" "$INDEX_OPEN")"
            echo "Index PR routing: $DECISION (auto-done open: $AUTO_DONE_OPEN, index open: $INDEX_OPEN)"
            [ "$DECISION" = "fold-into-auto-done" ] && break
          done

          if [ "$DECISION" = "fold-into-auto-done" ]; then
            echo "Auto-done PR is open — folding the fresh index into $AUTO_DONE_BRANCH instead of a second PR."
            for attempt in 1 2 3; do
              git fetch origin "$TARGET" "$AUTO_DONE_BRANCH" || { echo "Fetch failed, retrying..."; sleep 5; continue; }
              git checkout -B "$AUTO_DONE_BRANCH" "origin/$AUTO_DONE_BRANCH" || { echo "Checkout failed, retrying..."; sleep 5; continue; }
              # Fold onto the current tip so a push that landed mid-run does
              # not produce a stale index. On conflict, abort the merge and
              # fall back to a standalone index PR rather than guessing.
              if ! git merge "origin/$TARGET" -m "chore(backlog): merge $TARGET into $AUTO_DONE_BRANCH for fresh index"; then
                git merge --abort || true
                echo "Bot branch diverged, falling back to standalone index PR."
                DECISION="create-index-pr"
                break
              fi
              node scripts/backlog-index.mjs
              # shellcheck disable=SC2086
              if git diff --quiet -- $ARTIFACTS; then
                echo "Index already fresh on the auto-done branch, nothing to fold."
                exit 0
              fi
              # shellcheck disable=SC2086
              if git add $ARTIFACTS \
                && git commit -m "chore(backlog): regenerate INDEX.md and backlog artifacts" \
                && git push origin "$AUTO_DONE_BRANCH" --force-with-lease; then
                exit 0
              fi
              echo "Fold-in attempt $attempt failed, retrying..."
              sleep 5
            done
            # Reaching here means the fold did not land (push races or a
            # diverged branch) — fall through to a standalone index PR below.
            # The checkout there resets to a clean base, so no half-folded
            # state leaks into the new branch.
          fi

          BRANCH="$INDEX_BRANCH"

          git checkout -B "$BRANCH" "origin/$TARGET"
          node scripts/backlog-index.mjs
          # shellcheck disable=SC2086
          if git diff --quiet -- $ARTIFACTS; then
            echo "Backlog generated artifacts unchanged, nothing to commit."
            exit 0
          fi
          # shellcheck disable=SC2086
          git add $ARTIFACTS
          git commit -m "chore(backlog): regenerate INDEX.md and backlog artifacts"
          git push origin "$BRANCH" --force

          # Open the PR directly (not draft) only if none exists yet —
          # force-push keeps existing PRs up to date.
          if ! gh pr view "$BRANCH" --json number -q .number 2>/dev/null; then
            gh pr create \
              --title "chore(backlog): regenerate INDEX.md" \
              --body "Auto-generated by the weekly backlog full-resync. Updates \`INDEX.md\` and generated artifacts on \`develop\`." \
              --base "develop" \
              --head "$BRANCH"
          fi

          # Enable auto-merge so the PR closes itself once all checks pass.
          gh pr merge "$BRANCH" --auto --squash 2>/dev/null || \
            echo "Note: auto-merge unavailable — please merge the PR manually."
