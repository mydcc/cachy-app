name: Backlog Auto-Done on Merge

# Flips a backlog item to done once its linked PR merged, so no manual
# done-PR is needed anymore. Counterpart to sync-backlog.yml (which only
# syncs file -> issue, never back).
#
# Single-bot-PR: the flip commit also carries a freshly regenerated index,
# so one merge produces exactly one bot PR. The sync workflow folds into
# this branch instead of opening a second `chore/backlog-index-*` PR
# (routing via `scripts/lib/bot-pr-fold.ts`).
#
# Safety, by construction:
#   - only runs for PRs merged into develop (condition below)
#   - only honors the enforced `Fixes #N` trailer at a line start
#     (never prose — lesson from BUG-0220)
#   - only flips when #N is a backlog mirror issue (backlog-id: label),
#     is actually closed, and the item is not already done/dropped
#   - anything ambiguous only logs and exits 0, never blocks the merge

on:
  pull_request:
    types: [closed]

  # Safe manual testing against an already-merged PR.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR number to process
        required: true

concurrency:
  group: backlog-auto-done
  cancel-in-progress: false

jobs:
  flip:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'develop')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci --omit=dev

      - name: Flip merged items to done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/backlog-auto-done.mjs
