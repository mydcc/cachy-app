name: Commit Message Lint

on:
  pull_request:
    branches: [main, develop]

# Least-privilege default: this workflow only reads the PR's commits to lint
# them, it never writes to the repo or the GitHub API.
permissions:
  contents: read

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the PR commits plus the base branch to diff against.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint the PR's latest commit message
        # Only the tip commit is linted, not the full base..head range: with
        # squash-merge as the repo's merge strategy, the tip commit's message
        # is what actually lands on develop/main. Agentic contributors (Jules)
        # push many intermediate WIP commits per PR instead of amending one;
        # linting the whole range meant one non-conforming early commit could
        # never be fixed short of a history rewrite, permanently blocking the
        # PR even after later commits were clean.
        #
        # Message extracted directly via `git log -1 --format=%B` and piped
        # to stdin, rather than `commitlint --from SHA~1 --to SHA`, for two
        # reasons:
        # - The default checkout for a pull_request event is the synthetic
        #   refs/pull/N/merge ref, not head.sha, so `commitlint --last` would
        #   lint GitHub's auto-generated merge-ref message instead of the
        #   PR's actual tip commit.
        # - "$SHA~1" is only the tip's *first* parent. When the tip is itself
        #   a merge commit (e.g. base merged into the PR branch to resolve a
        #   conflict), `commitlint --from $SHA~1 --to $SHA` walks every
        #   commit reachable through the *second* parent too — the PR's
        #   entire "what's new since I branched" range from the base, not
        #   just the tip's own message. `--git-log-args "--first-parent"`
        #   looks like the fix but isn't: @commitlint/read's underlying git
        #   client silently ignores arbitrary git-log-args (see its own
        #   source comment), so it has no effect. Reading the one commit's
        #   message directly sidesteps range/parent logic entirely.
        run: |
          git log -1 --format=%B "${{ github.event.pull_request.head.sha }}" | npx commitlint --verbose
