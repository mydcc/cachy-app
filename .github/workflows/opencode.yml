name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # Interactive: mention /oc or /opencode in an issue or PR comment to trigger a
  # task (e.g. "/oc explain this issue", "/oc fix this", "/oc <change>" on a PR).
  # Write permissions let OpenCode create branches, commit and open pull
  # requests. The action authenticates via the installed OpenCode GitHub App
  # (OIDC); the write scopes also cover the GITHUB_TOKEN fallback path.
  opencode:
    if: |
      github.event_name != 'pull_request' &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          # Swap for a stronger model here once a provider key is configured.
          model: opencode/deepseek-v4-flash-free

  # Automated review of every non-draft PR against the Cachy checklist
  # (AGENTS.md -> Code Review Standard). Read-only towards the codebase: it only
  # posts a comment when it has findings, marked "Code Review for <sha>" so
  # re-runs are recognizable.
  review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash-free
          prompt: |
            Review this pull request using the Cachy review checklist:
            - If the PR links a backlog item (Fixes #NNN), read docs/backlog/ and
              check whether the diff satisfies the Acceptance Criteria and stays
              within Out of Scope.
            - Non-negotiable rules: Svelte 5 runes only (no export let, no $:, no
              createEventDispatcher, no <slot>); every $effect that registers
              listeners or subscriptions returns a cleanup function; decimal.js
              for ALL prices, amounts and balances (native number is forbidden for
              financial values); no hardcoded colors (CSS variables or paired
              classes from src/themes.css only); Local-First boundary (Class A
              data never leaves the device; core code must not import from
              src/lib/spacetimedb/ or src/services/cloudService.ts).
            - Do not repeat failures CI already reports.
            - Check plain correctness: logic errors, silent failures, unhandled
              edge cases.
            - If the PR touches area: execution, security, exchange, or priority
              P0, add a gentle note that human review is recommended before merge
              (no alarms, no uppercase shouting).
            - Only post a comment when you have findings. Start it with
              "Code Review for <short-sha>" so it is recognized on re-runs.