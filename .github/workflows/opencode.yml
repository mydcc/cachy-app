name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Doc-only PRs (backlog audits, markdown edits), CI-only PRs and pure
    # lockfile bumps get no automated agent review — it burns tokens without
    # any code to check. Human reviewers can still read those diffs themselves.
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/**"
      - "package-lock.json"
  # Weekly maintenance scan (needs its own prompt job, see "scheduled").
  schedule:
    - cron: "0 9 * * 1"
  # Manual run from the Actions tab (see "manual" job).
  workflow_dispatch:
    inputs:
      task:
        description: Task for OpenCode to execute
        required: true
        type: string

# Single place to change the models for every opencode job below. Each job
# tries OPENCODE_MODEL first; if the run fails (free-tier rate limits, provider
# outages), it falls back to the next entry. Keep fallbacks on different
# providers so one saturated upstream does not take all of them down.
env:
  OPENCODE_MODEL: opencode/big-pickle
  OPENCODE_MODEL_FALLBACK_1: opencode/nemotron-3-ultra-free
  OPENCODE_MODEL_FALLBACK_2: opencode/laguna-s-2.1-free
  REVIEW_PROMPT: |
    Review this pull request using the Cachy review checklist:
    - If the PR links a backlog item (Fixes #NNN), read docs/backlog/ and
      check whether the diff satisfies the Acceptance Criteria and stays
      within Out of Scope.
    - Non-negotiable rules: Svelte 5 runes only (no export let, no $:, no
      createEventDispatcher, no <slot>); every $effect that registers
      listeners or subscriptions returns a cleanup function; decimal.js
      for ALL prices, amounts and balances (native number is forbidden for
      financial values); no hardcoded colors (CSS variables or paired
      classes from src/themes.css only); Local-First boundary (Class A
      data never leaves the device; core code must not import from
      src/lib/spacetimedb/ or src/services/cloudService.ts).
    - Do not repeat failures CI already reports.
    - Check plain correctness: logic errors, silent failures, unhandled
      edge cases.
    - If the PR touches area: execution, security, exchange, or priority
      P0, add a gentle note that human review is recommended before merge
      (no alarms, no uppercase shouting).
    - Always post exactly one review comment for the commit you reviewed —
      with findings or, when there are none, a short Clean verdict. Start it
      with "Code Review for <short-sha>" so re-runs are recognizable per
      commit.
  WEEKLY_PROMPT: |
    Weekly maintenance scan:
    - Scan the codebase for TODO/FIXME/HACK comments and summarize the
      findings.
    - Check docs/backlog for items with incomplete acceptance criteria
      or unresolved open questions and list which ones block promotion
      to ready.
    - If you find issues worth addressing, open an issue to track them.
    - Do not modify code.

jobs:
  # Interactive: mention /oc or /opencode in an issue or PR comment to trigger a
  # task (e.g. "/oc explain this issue", "/oc fix this", "/oc <change>" on a PR).
  # Write permissions let OpenCode create branches, commit and open pull
  # requests. The action authenticates via the installed OpenCode GitHub App
  # (OIDC); the write scopes also cover the GITHUB_TOKEN fallback path.
  #
  # Only the repo owner (mydcc) may trigger it. On a public repo anyone can
  # comment on issues/PRs, so without an author allowlist an external user could
  # drive this write-capable agent. Extend the list if more users should get
  # interactive access:
  #   contains(fromJSON('["mydcc","someone-else"]'), github.event.comment.user.login)
  opencode:
    if: |
      github.event_name != 'pull_request' &&
      contains(fromJSON('["mydcc"]'), github.event.comment.user.login) &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    # Hard stop: an unattended agent stuck on a decision must never burn
    # runner minutes until the default 6h timeout. The budget covers up to
    # three fallback attempts; fast model failures (429/503) leave ample room.
    timeout-minutes: 35
    # Serialize interactive runs: two parallel /oc calls would push to the same
    # branches. Queued, never cancelled.
    concurrency:
      group: opencode-interactive
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # external_directory defaults to "ask"; in CI nobody can answer, so the
      # agent would hang forever. Deny instead: out-of-workspace access fails
      # fast and the agent adapts. GITHUB_TOKEN lets the gh CLI authenticate
      # from the environment so it never reads ~/.config/gh.
      - name: Configure opencode permissions for unattended runs
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": { "external_directory": { "**": "deny" } }
          }
          JSON

      # Fallback chain: free Zen models are rate-limited per model, so a run
      # can fail with 429/503 while other models still work. Try the primary,
      # then the fallbacks. Only the last attempt may fail the job.
      - name: Run opencode
        id: oc_primary
        uses: anomalyco/opencode/github@latest
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ env.OPENCODE_MODEL }}
          # Keep the session private even on this public repo.
          share: false

      - name: Run opencode (fallback 1)
        id: oc_fallback_1
        if: steps.oc_primary.outcome == 'failure'
        uses: anomalyco/opencode/github@latest
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ env.OPENCODE_MODEL_FALLBACK_1 }}
          share: false

      - name: Run opencode (fallback 2)
        id: oc_fallback_2
        if: steps.oc_primary.outcome == 'failure' && steps.oc_fallback_1.outcome == 'failure'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ env.OPENCODE_MODEL_FALLBACK_2 }}
          share: false

  # Automated review of every non-draft PR against the Cachy checklist
  # (AGENTS.md -> Code Review Standard). Read-only towards the codebase: it
  # posts exactly one comment per reviewed commit — findings or a Clean
  # verdict — marked "Code Review for <sha>" so re-runs are recognizable
  # per commit.
  #
  # Only PRs from branches in this repo are reviewed. Fork PRs are skipped:
  # GitHub does not pass secrets to fork-triggered workflows, so the opencode
  # action would fail without OPENCODE_API_KEY, and external PRs should not
  # drive the agent.
  review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft != true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Per-PR group: rapid push sequences cancel the stale review instead of
    # spending tokens/minutes on an outdated diff.
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # See the "Configure opencode permissions" comment in the interactive job.
      - name: Configure opencode permissions for unattended runs
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": { "external_directory": { "**": "deny" } }
          }
          JSON

      # Fallback chain, see the interactive job for rationale. Only the last
      # attempt may fail the job.
      - name: Run opencode review
        id: oc_primary
        uses: anomalyco/opencode/github@latest
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ env.OPENCODE_MODEL }}
          # Keep the session private even on this public repo.
          share: false
          prompt: ${{ env.REVIEW_PROMPT }}

      - name: Run opencode review (fallback 1)
        id: oc_fallback_1
        if: steps.oc_primary.outcome == 'failure'
        uses: anomalyco/opencode/github@latest
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ env.OPENCODE_MODEL_FALLBACK_1 }}
          share: false
          prompt: ${{ env.REVIEW_PROMPT }}

      - name: Run opencode review (fallback 2)
        id: oc_fallback_2
        if: steps.oc_primary.outcome == 'failure' && steps.oc_fallback_1.outcome == 'failure'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ env.OPENCODE_MODEL_FALLBACK_2 }}
          share: false
          prompt: ${{ env.REVIEW_PROMPT }}

      # One review run leaves two comments: the full review (posted as
      # github-actions[bot] via GITHUB_TOKEN) plus an opencode-agent[bot]
      # "Review posted:" pointer that only repeats the findings. Reviews are
      # meant to stay as one entry per commit, so this step also runs after
      # failed review attempts and collapses the noise: drop all pointer
      # comments and remove same-commit duplicates, keeping the newest
      # comment for each "Code Review for <sha>".
      - name: Prune duplicate bot review comments
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comments_url="repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments?per_page=100"

          gh api "$comments_url" --jq '.[]
            | select(.user.login == "opencode-agent[bot]"
                     and (.body | startswith("Review posted:")))
            | .id' | while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$id"
          done

          ids=$(gh api "$comments_url" --jq '[
            .[]
            | select(.user.login == "github-actions[bot]"
                     and (.body | startswith("Code Review for")))
            | {id, sha: (.body | split("\n")[0] | split(" ")[3])}
          ] | group_by(.sha) | map(.[:-1][] | .id)[]')
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$id"
          done

  # Weekly maintenance scan (schedule event): read-only — scans for TODOs and
  # backlog hygiene, only opens issues to track worthwhile findings. Never
  # modifies code.
  scheduled:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: opencode-scheduled
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # See the "Configure opencode permissions" comment in the interactive job.
      - name: Configure opencode permissions for unattended runs
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": { "external_directory": { "**": "deny" } }
          }
          JSON

      # Fallback chain, see the interactive job for rationale. Only the last
      # attempt may fail the job.
      - name: Run opencode weekly maintenance
        id: oc_primary
        uses: anomalyco/opencode/github@latest
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ env.OPENCODE_MODEL }}
          # Keep the session private even on this public repo.
          share: false
          prompt: ${{ env.WEEKLY_PROMPT }}

      - name: Run opencode weekly maintenance (fallback 1)
        id: oc_fallback_1
        if: steps.oc_primary.outcome == 'failure'
        uses: anomalyco/opencode/github@latest
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ env.OPENCODE_MODEL_FALLBACK_1 }}
          share: false
          prompt: ${{ env.WEEKLY_PROMPT }}

      - name: Run opencode weekly maintenance (fallback 2)
        id: oc_fallback_2
        if: steps.oc_primary.outcome == 'failure' && steps.oc_fallback_1.outcome == 'failure'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ env.OPENCODE_MODEL_FALLBACK_2 }}
          share: false
          prompt: ${{ env.WEEKLY_PROMPT }}

  # Manual run from the Actions tab (workflow_dispatch): the task text entered
  # in the UI is used verbatim as the prompt.
  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: opencode-manual
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # See the "Configure opencode permissions" comment in the interactive job.
      - name: Configure opencode permissions for unattended runs
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": { "external_directory": { "**": "deny" } }
          }
          JSON

      # Fallback chain, see the interactive job for rationale. Only the last
      # attempt may fail the job.
      - name: Run opencode manual task
        id: oc_primary
        uses: anomalyco/opencode/github@latest
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ env.OPENCODE_MODEL }}
          # Keep the session private even on this public repo.
          share: false
          prompt: ${{ inputs.task }}

      - name: Run opencode manual task (fallback 1)
        id: oc_fallback_1
        if: steps.oc_primary.outcome == 'failure'
        uses: anomalyco/opencode/github@latest
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ env.OPENCODE_MODEL_FALLBACK_1 }}
          share: false
          prompt: ${{ inputs.task }}

      - name: Run opencode manual task (fallback 2)
        id: oc_fallback_2
        if: steps.oc_primary.outcome == 'failure' && steps.oc_fallback_1.outcome == 'failure'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ env.OPENCODE_MODEL_FALLBACK_2 }}
          share: false
          prompt: ${{ inputs.task }}
