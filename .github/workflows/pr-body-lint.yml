name: PR Description Link Check

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [main, develop]

# Least-privilege default: this only reads the PR description to lint it, it
# never writes to the repo or the GitHub API.
permissions:
  contents: read

jobs:
  check-pr-body:
    name: Closing References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Enforce the closing-reference rules on the description
        # A separate job from commit-lint.yml's Conventional Commits check on
        # purpose: that one lints commits, which should never carry a closing
        # keyword at all (BUG-0220); this one lints the PR description against
        # both rules — it must close exactly its own issue, no more (BUG-0221)
        # and no less (BUG-0307: docs PRs merged with no reference at all,
        # closing nothing while the backlog markdown said done).
        #
        # Runs on `edited` as well as `opened`/`synchronize`, unlike
        # commit-lint.yml's tip-only check: a description can be rewritten
        # after the PR is opened without any new commit, and both real
        # incidents this check exists for were introduced that way.
        #
        # The body is handed to the script through `env:`, not interpolated
        # into this `run:` script directly — it is untrusted external content
        # (any PR author can set it), and interpolating it into a shell
        # command would be a command-injection surface. `env:` hands it to the
        # process as data instead of as script text.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: npx tsx scripts/lint-pr-body-refs.ts
