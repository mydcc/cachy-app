name: Deploy Build

# Builds the production artifact in GitHub Actions and publishes it to a
# per-branch moving release tag, so small servers can deploy without compiling
# on the box itself (deploy.sh --ci). develop -> deploy-beta, main -> deploy-stable.
#
# The server then downloads the artifact from a fixed URL:
#   https://github.com/<owner>/<repo>/releases/download/<tag>/cachy-build.tar.gz
# and only swaps it in + restarts — no npm ci + build, which is what OOM-killed
# the old 8 GB host builds.

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

# One in-flight build per branch; never cancel it mid-upload, or the moving
# release tag could be left without its asset. A queued run overwrites after.
concurrency:
  group: deploy-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    # BUG-0798: `workflow_dispatch` has no branch filter of its own, so the
    # ref has to be checked here. Without it, a dispatch from a feature branch
    # falls through to the "not main" branch below and overwrites deploy-beta
    # with a build nobody reviewed. Dispatch stays usable for re-publishing
    # from main or develop, which is what it is for.
    if: >
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write # create tags, releases and upload the build asset
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # scripts/build_wasm.sh only rebuilds the WASM module when a Rust toolchain
      # with the wasm32 target is present; otherwise it silently uses the
      # committed binary. Installing it here keeps the CI artifact equivalent to
      # what a server-side `npm run build` would have produced.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: technicals-wasm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package artifact
        run: tar -czf cachy-build.tar.gz build server.js server-headers.js server-precompressed.js

      # A release artifact must be self-contained: the postbuild step rewrites
      # build/index.js to `import '../server.js'`, so server.js and its
      # server-headers.js and server-precompressed.js dependencies have to
      # travel with build/ — otherwise `node build` on an artifact-only host
      # crashes with ERR_MODULE_NOT_FOUND. The checks also catch a silent
      # postbuild no-op (unpatched entry point).
      - name: Verify artifact
        run: |
          tar -tzf cachy-build.tar.gz > "$RUNNER_TEMP/artifact-contents.txt"
          for entry in build/index.js server.js server-headers.js server-precompressed.js; do
            grep -qx "$entry" "$RUNNER_TEMP/artifact-contents.txt" \
              || { echo "::error::$entry is missing from cachy-build.tar.gz"; exit 1; }
          done
          grep -q "server.js" build/index.js \
            || { echo "::error::build/index.js was not patched to delegate to server.js"; exit 1; }

      - name: Publish artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as data, not interpolated into the script: a ref name can
          # contain shell metacharacters, and this step holds `contents: write`.
          DEPLOY_REF: ${{ github.ref }}
        run: |
          # BUG-0798: the job guard already restricts the ref, but the tag
          # choice must not depend on it alone — a future trigger could reach
          # this step from a ref the guard does not know about, and the old
          # "not main -> beta" fallback would publish it. Refuse instead.
          case "$DEPLOY_REF" in
            refs/heads/main)    TAG="deploy-stable" ;;
            refs/heads/develop) TAG="deploy-beta" ;;
            *)
              echo "::error::refusing to publish '$DEPLOY_REF' to a deploy tag"
              exit 1
              ;;
          esac
          PREV="${TAG}-previous"
          # Preserve the current artifact as <tag>-previous before overwriting,
          # so a failing deploy can roll back to the last known-good build
          # without a rebuild. Idempotent: only the newest previous is kept.
          #
          # Best-effort by design: gh creates a release as a draft, uploads the
          # asset, then publishes, so a failed upload can leave a release with no
          # asset — and downloading from it exits non-zero, which under the
          # default `bash -e` aborts the step. A missing rollback snapshot is a
          # warning; a missing deploy artifact is a failure. See BUG-0796.
          TAG_EXISTS=false
          if VIEW=$(gh release view "$TAG" --json isDraft 2>"$RUNNER_TEMP/gh-view.err"); then
            TAG_EXISTS=true
            DRAFT_NOW=$(printf '%s' "$VIEW" | jq -r '.isDraft' 2>/dev/null || echo unknown)
            if [ "$DRAFT_NOW" != "false" ]; then
              # A draft is a build that was never live; preserving it would make
              # the rollback target a build nobody deployed.
              echo "::warning::$TAG is a draft (isDraft=$DRAFT_NOW), so it is not a known-good build and is not preserved as $PREV"
            else
              rm -rf .deploy_prev && mkdir -p .deploy_prev
              SNAPSHOT_OK=false
              for dl in 1 2 3; do
                if gh release download "$TAG" \
                     --pattern "cachy-build.tar.gz" \
                     --dir .deploy_prev --clobber; then
                  SNAPSHOT_OK=true
                  break
                fi
                echo "::warning::could not download $TAG's artifact (attempt $dl/3); the error above says whether the asset is missing or the API call failed"
                if [ "$dl" != "3" ]; then sleep $((dl * 5)); fi
              done
              if [ "$SNAPSHOT_OK" = "true" ]; then
                gh release delete "$PREV" --yes --cleanup-tag >/dev/null \
                  || echo "::warning::$PREV could not be cleared; it may still hold an older build"
                gh release create "$PREV" \
                  --title "Deploy artifact ($PREV)" \
                  --notes "Previous $TAG artifact, preserved before the build at ${{ github.sha }}." \
                  .deploy_prev/cachy-build.tar.gz \
                  || echo "::error::could not recreate $PREV: the previous rollback artifact was already deleted, so rollback is unavailable until a later build snapshots successfully"
              fi
              rm -rf .deploy_prev
            fi
          elif ! grep -qiE 'release not found|could not find' "$RUNNER_TEMP/gh-view.err"; then
            echo "::warning::could not inspect $TAG, so no rollback snapshot was taken: $(tr '\n' ' ' < "$RUNNER_TEMP/gh-view.err")"
          fi

          # Force-recreate the moving tag + release; idempotent per build.
          if [ "$TAG_EXISTS" = "true" ]; then
            gh release delete "$TAG" --yes --cleanup-tag >/dev/null \
              || echo "::warning::$TAG could not be deleted; publishing below will fail on the occupied tag"
          fi
          # Retry: the releases API answered 502 once (BUG-0796). A failed
          # attempt can leave a draft that reserves the tag name, so clear it
          # before retrying instead of inheriting the broken state.
          for attempt in 1 2 3; do
            if gh release create "$TAG" \
                 --target "${{ github.sha }}" \
                 --title "Deploy artifact ($TAG)" \
                 --notes "Automated build artifact for '$DEPLOY_REF' @ $GITHUB_SHA." \
                 cachy-build.tar.gz 2>"$RUNNER_TEMP/gh-create-$attempt.err"; then
              break
            fi
            LAST_ERR=$(tr '\n' ' ' < "$RUNNER_TEMP/gh-create-$attempt.err")
            echo "::warning::publishing $TAG failed (attempt $attempt/3): $LAST_ERR"
            case "$LAST_ERR" in
              *"HTTP 401"*|*"HTTP 403"*|*"HTTP 422"*)
                echo "::error::publishing $TAG hit a non-retryable error; check contents: write on this job and any tag protection rule covering $TAG"
                exit 1
                ;;
            esac
            gh release delete "$TAG" --yes --cleanup-tag >/dev/null \
              || echo "::warning::could not clear the failed $TAG release before retry $attempt"
            if [ "$attempt" = "3" ]; then
              echo "::error::could not publish $TAG after 3 attempts: $LAST_ERR"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          # Verify what the host will actually fetch. A draft's assets need a
          # token, and `--target` is ignored when the tag ref already exists, so
          # the CLI's exit code proves nothing. BUG-0796.
          VERIFY=$(gh release view "$TAG" --json isDraft,assets,targetCommitish \
            --jq '[.isDraft, (.targetCommitish | .[0:9]), (any(.assets[]; .name == "cachy-build.tar.gz"))] | @tsv' \
            2>"$RUNNER_TEMP/gh-verify.err") \
            || { echo "::error::could not verify $TAG: $(tr '\n' ' ' < "$RUNNER_TEMP/gh-verify.err")"; exit 1; }
          IFS=$'\t' read -r IS_DRAFT TARGET_SHA HAS_ASSET <<< "$VERIFY"
          if [ "$IS_DRAFT" != "false" ] || [ "$HAS_ASSET" != "true" ] || [ "$TARGET_SHA" != "${GITHUB_SHA:0:9}" ]; then
            echo "::error::$TAG is draft=$IS_DRAFT, target=${TARGET_SHA:-unknown}, carries cachy-build.tar.gz=$HAS_ASSET; expected false, ${GITHUB_SHA:0:9}, true - delete a surviving draft release and re-run"
            exit 1
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/cachy-build.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o /dev/null "$URL" \
            || { echo "::error::$URL is not anonymously fetchable; the host would 404 even though the release reports published"; exit 1; }
