name: Deploy Build

# Builds the production artifact in GitHub Actions and publishes it to a
# per-branch moving release tag, so small servers can deploy without compiling
# on the box itself (deploy.sh --ci). develop -> deploy-beta, main -> deploy-stable.
#
# The server then downloads the artifact from a fixed URL:
#   https://github.com/<owner>/<repo>/releases/download/<tag>/cachy-build.tar.gz
# and only swaps it in + restarts — no npm ci + build, which is what OOM-killed
# the old 8 GB host builds.

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

# One in-flight build per branch; never cancel it mid-upload, or the moving
# release tag could be left without its asset. A queued run overwrites after.
concurrency:
  group: deploy-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write # create tags, releases and upload the build asset
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # scripts/build_wasm.sh only rebuilds the WASM module when a Rust toolchain
      # with the wasm32 target is present; otherwise it silently uses the
      # committed binary. Installing it here keeps the CI artifact equivalent to
      # what a server-side `npm run build` would have produced.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: technicals-wasm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package artifact
        run: tar -czf cachy-build.tar.gz build server.js server-headers.js server-precompressed.js

      # A release artifact must be self-contained: the postbuild step rewrites
      # build/index.js to `import '../server.js'`, so server.js and its
      # server-headers.js and server-precompressed.js dependencies have to
      # travel with build/ — otherwise `node build` on an artifact-only host
      # crashes with ERR_MODULE_NOT_FOUND. The checks also catch a silent
      # postbuild no-op (unpatched entry point).
      - name: Verify artifact
        run: |
          tar -tzf cachy-build.tar.gz > "$RUNNER_TEMP/artifact-contents.txt"
          for entry in build/index.js server.js server-headers.js server-precompressed.js; do
            grep -qx "$entry" "$RUNNER_TEMP/artifact-contents.txt" \
              || { echo "::error::$entry is missing from cachy-build.tar.gz"; exit 1; }
          done
          grep -q "server.js" build/index.js \
            || { echo "::error::build/index.js was not patched to delegate to server.js"; exit 1; }

      - name: Publish artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG="deploy-stable"
          else
            TAG="deploy-beta"
          fi
          PREV="${TAG}-previous"
          # Preserve the current artifact as <tag>-previous before overwriting,
          # so a failing deploy can roll back to the last known-good build
          # without a rebuild. Idempotent: only the newest previous is kept.
          #
          # The snapshot is best-effort on purpose. `gh release create` creates
          # the release first, uploads the asset second and publishes last, so an
          # interrupted upload leaves a *draft* with no asset. `gh release
          # download` then exits non-zero, and under `set -e` that used to abort
          # the step before the rebuild: one transient 5xx from the releases API
          # (HTTP 502, 2026-11-04) wedged every later build until somebody
          # deleted the empty draft by hand. A missing rollback snapshot is a
          # warning; a missing deploy artifact is a failure.
          if gh release view "$TAG" >/dev/null 2>&1; then
            rm -rf .deploy_prev && mkdir -p .deploy_prev
            if gh release download "$TAG" \
                 --pattern "cachy-build.tar.gz" \
                 --dir .deploy_prev --clobber; then
              gh release delete "$PREV" --yes --cleanup-tag >/dev/null 2>&1 || true
              gh release create "$PREV" \
                --title "Deploy artifact ($PREV)" \
                --notes "Previous $TAG artifact, preserved before the build at ${{ github.sha }}." \
                .deploy_prev/cachy-build.tar.gz \
                || echo "::warning::could not snapshot the previous artifact into $PREV"
            else
              echo "::warning::$TAG carries no cachy-build.tar.gz (draft or partial release); skipping the rollback snapshot"
            fi
            rm -rf .deploy_prev
          fi
          # Force-recreate the moving tag + release; idempotent per build.
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          # Retry: the releases API returns sporadic 5xx under load. A failed
          # attempt leaves a draft behind that occupies the tag name, so clear
          # it before trying again instead of inheriting the broken state.
          for attempt in 1 2 3; do
            if gh release create "$TAG" \
                 --target "${{ github.sha }}" \
                 --title "Deploy artifact ($TAG)" \
                 --notes "Automated build artifact for ${{ github.ref }} @ ${{ github.sha }}." \
                 cachy-build.tar.gz; then
              break
            fi
            echo "::warning::publishing $TAG failed (attempt $attempt/3)"
            gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
            if [ "$attempt" = "3" ]; then
              echo "::error::could not publish $TAG after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          # A draft is not downloadable without a token, so the server's
          # anonymous curl would 404 while this job still reported success.
          # Verify what the server will actually fetch.
          DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          ASSET=$(gh release view "$TAG" --json assets \
            --jq '[.assets[].name] | index("cachy-build.tar.gz") // empty')
          if [ "$DRAFT" != "false" ] || [ -z "$ASSET" ]; then
            echo "::error::$TAG is draft=$DRAFT and asset present=${ASSET:+yes}; the server would get a 404"
            exit 1
          fi
