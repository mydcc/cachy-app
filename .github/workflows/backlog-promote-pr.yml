name: Backlog Promotion Audit

on:
  pull_request:
    paths:
      - 'docs/backlog/**/*.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Audit Batch Promotion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Audit promotion PR
        id: audit
        env:
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/backlog-promote-workflow.mjs

      - name: Comment audit results
        if: steps.audit.outputs.is_promotion_pr == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read audit results from .audit-results.json in repo root
            const resultsFile = path.join(process.env.GITHUB_WORKSPACE, '.audit-results.json');

            if (!fs.existsSync(resultsFile)) {
              console.log('No audit results file found');
              return;
            }

            const results = JSON.parse(fs.readFileSync(resultsFile, 'utf8'));

            let comment = `## 📋 Backlog Promotion Audit\n\n`;

            if (results.items && results.items.length > 0) {
              comment += `### Promoted Items (${results.items.length})\n\n`;
              comment += `| ID | Title | Status | Result |\n`;
              comment += `|----|-------|--------|--------|\n`;

              for (const item of results.items) {
                const icon = item.valid ? '✅' : '❌';
                const status = item.valid ? 'Valid' : 'Invalid';
                comment += `| ${item.id} | ${item.title} | specced → ready | ${icon} ${status} |\n`;
              }

              comment += `\n`;
            }

            if (results.warnings && results.warnings.length > 0) {
              comment += `### ⚠️ Warnings\n\n`;
              for (const warning of results.warnings) {
                comment += `- ${warning}\n`;
              }
              comment += `\n`;
            }

            if (results.errors && results.errors.length > 0) {
              comment += `### ❌ Errors\n\n`;
              for (const error of results.errors) {
                comment += `- ${error}\n`;
              }
              comment += `\n`;
            }

            if (results.valid) {
              comment += `✅ **All checks passed.** Items are ready to promote.\n`;
            } else {
              comment += `❌ **Audit failed.** Please review errors above.\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Add promotion label
        if: steps.audit.outputs.is_promotion_pr == 'true' && steps.audit.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['backlog-batch-promotion']
            });

      - name: Fail on invalid audit
        if: steps.audit.outputs.is_promotion_pr == 'true' && steps.audit.outputs.valid != 'true'
        run: exit 1
