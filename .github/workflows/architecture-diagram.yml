name: Architecture Diagram

on:
  pull_request:
    paths:
      - 'docs/architecture/**'
      - '.github/workflows/architecture-diagram.yml'

jobs:
  check:
    name: Validate diagram & HTML freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Archify
        run: |
          git clone --depth 1 https://github.com/tt-a1i/archify.git /tmp/archify
          npm install --prefix /tmp/archify

      - name: Validate diagram (showcase quality)
        run: node /tmp/archify/bin/archify.mjs validate dataflow docs/architecture/cachy-architecture.dataflow.json --quality showcase

      - name: Check committed HTML is fresh
        run: |
          node /tmp/archify/bin/archify.mjs deliver dataflow \
            docs/architecture/cachy-architecture.dataflow.json \
            /tmp/fresh.html
          if ! diff -q /tmp/fresh.html docs/architecture/cachy-architecture.dataflow.html > /dev/null; then
            echo "::error::cachy-architecture.dataflow.html is stale. Run 'npm run arch' locally and commit the regenerated HTML together with the JSON."
            exit 1
          fi
