name: Architecture Diagram

on:
  pull_request:
    paths:
      - 'docs/architecture/**'
      - 'scripts/archify.mjs'
      - 'scripts/archify.pin.json'
      - '.github/workflows/architecture-diagram.yml'

permissions:
  contents: read

jobs:
  check:
    name: Validate diagram & HTML freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The renderer version lives in scripts/archify.pin.json and nowhere else.
      # The same script runs locally (`npm run arch`), so CI and a contributor
      # cannot disagree about which Archify rendered the committed HTML.
      - name: Validate diagram (showcase quality)
        run: node scripts/archify.mjs validate

      - name: Check committed HTML is fresh
        run: |
          node scripts/archify.mjs build /tmp/fresh.html
          if ! diff -q /tmp/fresh.html docs/architecture/cachy-architecture.dataflow.html > /dev/null; then
            echo "::error::cachy-architecture.dataflow.html is stale. Run 'npm run arch' locally and commit the regenerated HTML together with the JSON."
            exit 1
          fi
