name: Code Quality Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  i18n-lint:
    name: i18n String Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check for hardcoded strings
        run: node scripts/lint-i18n.js

  decimal-check:
    name: Decimal.js Enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for unsafe number arithmetic in critical files
        run: |
          # Search for Number() / parseFloat / toFixed in critical trading services
          echo "Checking for unsafe number operations in critical files..."

          VIOLATIONS=0

          for file in src/services/tradeService.ts src/services/apiService.ts src/lib/calculator.ts; do
            if [ -f "$file" ]; then
              MATCHES=$(grep -n -E '(Number\(|parseFloat\(|parseFloat |toFixed\()' "$file" || true)
              if [ ! -z "$MATCHES" ]; then
                echo "❌ Unsafe number operations found in $file:"
                echo "$MATCHES"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi
            fi
          done

          if [ $VIOLATIONS -gt 0 ]; then
            echo ""
            echo "Please use Decimal.js for all financial calculations."
            exit 1
          else
            echo "✅ All critical files use Decimal.js correctly."
          fi

  docs-check:
    name: Backlog & Documentation Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Validates every backlog item's front matter (status, priority, edition,
      # data class, id/filename agreement, dependencies that actually exist) and
      # fails if INDEX.md is stale. Without this the index is a hand-maintained
      # copy of the directory, which is exactly the drift docs/REPO-AUDIT.md is
      # about. No dependencies needed — the script is plain Node.
      - name: Validate backlog front matter and index
        run: npm run backlog:check

      # A moved or renamed document silently breaks every pointer to it. That
      # happened when the old roadmap was archived and is cheap to prevent.
      - name: Check relative links in Markdown
        run: node scripts/check-doc-links.mjs

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Runs the whole suite. This used to be limited to three hand-picked files
      # because 28 tests failed on develop regardless of the change under review,
      # which made a full run useless as a gate. Those are fixed, so a red run
      # now means the pull request broke something.
      - name: Run unit tests
        run: npm test

  performance:
    name: Performance Benchmarks (non-blocking)
    runs-on: ubuntu-latest
    # Informational only. These assert wall-clock time and heap growth, which on a
    # shared runner is dominated by noise — the scaling check compares a ~5ms
    # measurement against a ~24ms one. A red run here is a hint to look, never a
    # reason to block a pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run performance benchmarks
        run: npm run test:perf

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run svelte-check
        run: npm run check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Roadmap item 21's no-explicit-any / no-unused-vars backlog reached
      # zero; both rules are "error" in eslint.config.js now, so any error
      # (including either of those two) fails the build. No more ratchet.
      - name: Run ESLint
        run: npx eslint .
