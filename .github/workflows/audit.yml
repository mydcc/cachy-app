name: Code Quality Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  i18n-lint:
    name: i18n String Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check for hardcoded strings
        run: node scripts/lint-i18n.js

  decimal-check:
    name: Decimal.js Enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for unsafe number arithmetic in critical files
        run: |
          # Search for Number() / parseFloat / toFixed in critical trading services
          echo "Checking for unsafe number operations in critical files..."

          VIOLATIONS=0

          for file in src/services/tradeService.ts src/services/apiService.ts src/lib/calculator.ts; do
            if [ -f "$file" ]; then
              MATCHES=$(grep -n -E '(Number\(|parseFloat\(|parseFloat |toFixed\()' "$file" || true)
              if [ ! -z "$MATCHES" ]; then
                echo "❌ Unsafe number operations found in $file:"
                echo "$MATCHES"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi
            fi
          done

          if [ $VIOLATIONS -gt 0 ]; then
            echo ""
            echo "Please use Decimal.js for all financial calculations."
            exit 1
          else
            echo "✅ All critical files use Decimal.js correctly."
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Runs the whole suite. This used to be limited to three hand-picked files
      # because 28 tests failed on develop regardless of the change under review,
      # which made a full run useless as a gate. Those are fixed, so a red run
      # now means the pull request broke something.
      - name: Run unit tests
        run: npm test

  performance:
    name: Performance Benchmarks (non-blocking)
    runs-on: ubuntu-latest
    # Informational only. These assert wall-clock time and heap growth, which on a
    # shared runner is dominated by noise — the scaling check compares a ~5ms
    # measurement against a ~24ms one. A red run here is a hint to look, never a
    # reason to block a pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run performance benchmarks
        run: npm run test:perf

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run svelte-check
        run: npm run check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Two gates:
      #  - Any error fails the build. The error count is 0 and must stay 0.
      #  - The warning ceiling is a ratchet over the pre-existing
      #    no-explicit-any / no-unused-vars backlog. It may only ever be
      #    lowered, never raised, so the backlog cannot grow silently.
      #    Lower it as warnings are fixed; see docs/ROADMAP.md item 21.
      - name: Run ESLint
        run: npx eslint . --max-warnings 768
