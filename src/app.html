<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preload" href="/fonts/Inter/Inter-VariableFont_opsz,wght.ttf" as="font" type="font/ttf" crossorigin />

    <!-- Prevent indexing of subdomains (dev, metaverse) -->
    <script nonce="%sveltekit.nonce%">
      if (
        window.location.hostname.includes("dev.cachy.app") ||
        window.location.hostname.includes("metaverse.cachy.app")
      ) {
        const meta = document.createElement("meta");
        meta.name = "robots";
        meta.content = "noindex, nofollow";
        document.head.appendChild(meta);
      }
    </script>

    <!-- Favicons for different platforms and browsers -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Basic SEO -->
    <title>Cachy - Position Size & Risk Management</title>
    <meta
      name="description"
      content="Cachy is a comprehensive trading calculator for position sizing, risk management, and take-profit targets. Optimize your trades with real-time calculations and visual analysis."
    />
    <meta
      name="keywords"
      content="trading calculator, position size, risk management, take profit, crypto trading, forex trading, stock trading, trading tools, financial calculator, trade optimizer"
    />
    <link rel="canonical" href="https://cachy.app/" />

    <!-- Multilingual Support (hreflang) -->
    <link rel="alternate" hreflang="en" href="https://cachy.app/" />
    <link rel="alternate" hreflang="de" href="https://cachy.app/" />
    <link rel="alternate" hreflang="x-default" href="https://cachy.app/" />
    <!-- Replace with your actual domain -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cachy.app/" />
    <!-- Replace with your actual domain -->
    <meta
      property="og:title"
      content="Cachy - Position Size & Risk Management"
    />
    <meta property="og:description" content="Cachy is a comprehensive trading calculator for position sizing, risk management, and take-profit targets. Optimize your trades with real-time calculations and visual analysis." />
    <meta property="og:image" content="https://cachy.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cachy - Position Size & Risk Management Dashboard" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://cachy.app/" />
    <meta name="twitter:title" content="Cachy - Position Size & Risk Management" />
    <meta name="twitter:description" content="Cachy is a comprehensive trading calculator for position sizing, risk management, and take-profit targets. Optimize your trades with real-time calculations and visual analysis." />
    <meta name="twitter:image" content="https://cachy.app/twitter-image.jpg" />
    <meta name="twitter:image:alt" content="Cachy - Position Size & Risk Management Dashboard" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Structured Data (Schema.org) for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Cachy",
        "alternateName": "Cachy - Position Size & Risk Management",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web Browser",
        "browserRequirements": "Requires JavaScript. Modern browsers recommended.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Comprehensive trading calculator for position sizing, risk management, and take-profit targets. Optimize your trades with real-time calculations and visual analysis.",
        "url": "https://cachy.app",
        "screenshot": "https://cachy.app/og-image.jpg",
        "featureList": [
          "Position Size Calculator",
          "Risk Management Tools",
          "Take-Profit Target Optimization",
          "Real-time Trade Calculations",
          "Visual Trade Analysis",
          "Trade Journal & Statistics",
          "Multi-Asset Support (Crypto, Forex, Stocks)",
          "Advanced Technical Indicators"
        ],
        "creator": {
          "@type": "Organization",
          "name": "Cachy"
        },
        "inLanguage": ["en-US", "de-DE"],
        "isAccessibleForFree": true
      }
    </script>

    %sveltekit.head%

    <!-- Matomo Tag Manager: NOT loaded here. Telemetry is opt-out
         (BUG-0286): trackingService.initTracking() injects the container on
         startup unless the user disabled it under Settings > System >
         Performance ("Usage Statistics"). -->

    <!-- Theme Initialization (CRITICAL: Must run BEFORE any rendering) -->
    <script nonce="%sveltekit.nonce%">
      (function () {
        try {
          var theme = localStorage.getItem("cachy_theme") || "dark";

          // Apply theme class immediately
          if (theme !== "dark") {
            document.documentElement.classList.add("theme-" + theme);
          }

          // CRITICAL: Set background color inline to prevent white flash
          // This ensures the correct background is shown BEFORE CSS loads
          var bgColors = {
            dark: "#0f172a",
            "ayu-dark": "#0f1419",
            "ayu-mirage": "#1f2430",
            catppuccin: "#1e1e2e",
            cobalt2: "#193549",
            dracula: "#282a36",
            "dracula-soft": "#282a36",
            "everforest-dark": "#2d353b",
            "github-dark": "#0d1117",
            "gruvbox-dark": "#282828",
            matrix: "#000000",
            midnight: "#0d1117",
            monokai: "#1e1f1c",
            "night-owl": "#011627",
            nord: "#2e3440",
            obsidian: "#1e1e1e",
            "one-dark-pro": "#282c34",
            "solarized-dark": "#002b36",
            "tokyo-night": "#1a1b26",
            VIP: "#121212",
            "ayu-light": "#f8f9fa",
            "github-light": "#ffffff",
            "solarized-light": "#fdf6e3",
            steel: "#08103f",
            meteorite: "#0c082f",
            insight: "#0f0505",
            ever: "#010f08",
            light: "#f1f5f9",
          };

          var bgColor = bgColors[theme] || bgColors["dark"];
          document.documentElement.style.backgroundColor = bgColor;
        } catch (e) {
          // Silently fail if localStorage is not available
          document.documentElement.style.backgroundColor = "#0f172a";
        }
      })();
    </script>
  </head>

  <body class="min-h-screen" data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
